<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="{baseUri}/">
    <link rel="stylesheet" href="./styles/app.css">
</head>
<body>

        <div class="select-wrapper">
            <div id="view-buttons"></div>

    </div>

    <script type="module" src="./scripts/graph.js"></script>

</html>
